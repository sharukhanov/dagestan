<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#16181c" />
    <meta name="description" content="Интерактивная карта истории Дагестана: государства, города и события от каменного века до наших дней, с научными источниками." />
    <title>История Дагестана</title>
    <!-- Превью ссылки в Telegram, VK, WhatsApp и соцсетях -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dagestan.sharukhanov.com/" />
    <meta property="og:site_name" content="История Дагестана" />
    <meta property="og:title" content="История Дагестана — десять тысяч лет на одной карте" />
    <meta property="og:description" content="Государства, города и события — от каменного века до наших дней. Каждый факт сверен с научными источниками." />
    <meta property="og:image" content="https://dagestan.sharukhanov.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ru_RU" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2316181c'/%3E%3Cpath d='M5 24 L12 11 L17 18 L21 13 L27 24 Z' fill='%23c9a46a'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="map" aria-label="Карта"></div>
    <div id="paper" aria-hidden="true"></div>

    <header class="topbar">
      <div class="brand">
        <h1>История Дагестана</h1>
        <div class="epoch-now" id="epoch-now"></div>
        <button type="button" class="src-btn" id="src-btn" aria-expanded="false">Источники <span class="n"></span></button>
      </div>
      <div class="basemap-switch" role="radiogroup" aria-label="Подложка">
        <button type="button" role="radio" data-theme="old">Старая карта</button>
        <button type="button" role="radio" data-theme="modern">Современная</button>
      </div>
    </header>

    <aside class="legend" id="legend" aria-label="Легенда карты"></aside>

    <section class="timeline" id="timeline" aria-label="Временная шкала"></section>

    <aside class="card" id="card" aria-hidden="true" aria-label="Карточка события"></aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
