name: Деплой на GitHub Pages

# Собирает сайт и кладёт результат в ветку gh-pages — GitHub Pages публикует её.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Опубликовать dist в gh-pages
        run: |
          cd dist
          touch .nojekyll
          # Свой домен: если в репозитории есть файл CNAME, он попадает в публикацию.
          [ -f ../CNAME ] && cp ../CNAME .
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Сборка ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
